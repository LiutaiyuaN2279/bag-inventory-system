plugins {
    id 'com.android.application'
}

// ---------------------------------------------------------------- 签名配置
// 签名信息放在 android/keystore.properties（已被 .gitignore 排除，格式见
// android/keystore.properties.example）。文件不存在时自动回落到 Android 默认的
// debug 签名，保证 clone 本仓库后不做任何配置也能打出可安装的 APK。
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseSigning = keystorePropsFile.exists()
        && keystoreProps['storeFile']
        && keystoreProps['storePassword']
        && keystoreProps['keyAlias']
        && keystoreProps['keyPassword']

android {
    namespace 'com.bagpurchase.inventory'
    compileSdk 34

    defaultConfig {
        applicationId "com.bagpurchase.inventory"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            // storeFile 的相对路径按 app 模块目录（android/app）解析，也可直接写绝对路径
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // 配了自己的密钥就用自有密钥；没配则用 debug 签名（仅够本地演示与自测）
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += ['META-INF/*']
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'androidx.core:core:1.12.0'

    // appcompat 会传递引入 kotlin-stdlib-jdk7/jdk8(1.6.0)，与新 stdlib(1.8.22)
    // 存在重复类冲突：统一约束到 1.8.22（jdk7/jdk8 自 1.8 起已并入 stdlib）。
    implementation(platform('org.jetbrains.kotlin:kotlin-bom:1.8.22'))
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22')
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22')
    }
}
