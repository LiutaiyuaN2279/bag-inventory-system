name: Web CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Web backend regression
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip==26.2.2
          python -m pip install -r requirements-verify.txt
          python -m pip check
      - name: Run isolated core regression
        run: python -B scripts/verify_preview_core.py
      - name: Run preview workflow regression
        run: python -B scripts/verify_preview_flows.py

  frontend:
    name: Web frontend test and build
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run frontend regression
        run: node --test tests/audit-p0.test.js tests/purchase-arrival.test.js tests/quality-traceability.test.js
      - name: Build frontend
        run: npm run build -- --configLoader native
